# OpenJAWZ — Hyprland snippet.  Add to ~/.config/hypr/hyprland.conf:
#     source = ~/.config/hypr/openjawz.conf
# (`openjawz ui install` copies this file there and prints the line; it never edits hyprland.conf.)

bind = SUPER, J, exec, openjawz summon
bind = SUPER SHIFT, J, exec, openjawz summon --new

# the agent window lives in a special workspace: summon toggles it in over whatever you are doing
windowrule = workspace special:openjawz silent, class:^(openjawz)$
windowrule = float, class:^(openjawz)$
windowrule = size 60% 70%, class:^(openjawz)$
windowrule = center, class:^(openjawz)$

# snappy toggle (optional): animation = specialWorkspace, 1, 2, default, slidevert

# hand-rolled sessions (no uwsm): make the user manager see the compositor so the Wayland hooks can start
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP DBUS_SESSION_BUS_ADDRESS && systemctl --user start hyprland-session.target
