# OpenJAWZ — sway snippet.  Add to ~/.config/sway/config:
#     include ~/.config/sway/openjawz.conf
bindsym $mod+j exec openjawz summon
bindsym $mod+Shift+j exec openjawz summon --new
for_window [app_id="openjawz"] floating enable, resize set 60 ppt 70 ppt, move position center, move scratchpad
